name: curio
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = build a video but do NOT publish it (download it to check) | publish = make and schedule a real video"
        type: choice
        options:
          - test
          - publish
        default: test
      force:
        description: "publish only: add a video even if the queue is full"
        type: boolean
        default: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: post
      cancel-in-progress: false
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system packages
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: python packages
        run: pip install numpy pillow requests edge-tts gTTS kokoro-onnx google-api-python-client google-auth
      - name: keep the Kokoro voice files between runs
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: TEST - check keys, voice and logo
        if: inputs.mode == 'test'
        continue-on-error: true
        run: python main.py check
      - name: TEST - build a video without publishing
        if: inputs.mode == 'test'
        run: python main.py --dry
      - name: TEST - save the video so you can download it
        if: inputs.mode == 'test'
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: |
            out/video.mp4
            out/thumb.jpg
          retention-days: 3

      - name: PUBLISH - make and schedule one video
        if: inputs.mode != 'test'
        run: python main.py
        env:
          FORCE: ${{ inputs.force && '1' || '0' }}
      - name: PUBLISH - save state
        if: always() && inputs.mode != 'test'
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
