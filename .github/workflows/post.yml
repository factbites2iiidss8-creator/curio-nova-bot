
name: curio
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "1 = ignore the queue limit"
        default: "0"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: system packages
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: python packages
        run: pip install numpy pillow requests edge-tts gTTS google-api-python-client google-auth
      - name: make and schedule one video
        run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
      - name: save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
